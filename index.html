<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Daftar Tugas Harian</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <header class="header">
                <h1>📝 Daftar Tugas Saya</h1>
                <p class="subtitle">Tetap produktif dan terorganisir</p>
            </header>

            <div class="input-section">
                <input 
                    type="text" 
                    id="inputTugas" 
                    class="input-tugas" 
                    placeholder="Tambahkan tugas baru..."
                    autocomplete="off"
                >
                <button id="btnTambah" class="btn-tambah">Tambah</button>
            </div>

            <div class="filter-section">
                <button class="btn-filter active" data-filter="semua">Semua</button>
                <button class="btn-filter" data-filter="aktif">Aktif</button>
                <button class="btn-filter" data-filter="selesai">Selesai</button>
            </div>

            <div class="stats-section">
                <div class="stat">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Aktif:</span>
                    <span class="stat-value" id="aktifCount">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Selesai:</span>
                    <span class="stat-value" id="selesaiCount">0</span>
                </div>
            </div>

            <ul class="daftar-tugas" id="daftarTugas"></ul>

            <div class="action-section">
                <button id="btnHapusSelesai" class="btn-aksi btn-warning">Hapus Yang Selesai</button>
                <button id="btnHapusSemua" class="btn-aksi btn-danger">Hapus Semua</button>
            </div>

            <div class="empty-state" id="emptyState">
                <p>📭 Tidak ada tugas. Tambahkan satu untuk memulai!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
